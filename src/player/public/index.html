<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Screening Room</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("sr-theme-mode");
          var a = localStorage.getItem("sr-theme-accent") || "ink";
          var d = m === "dark" || ((m === null || m === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", d);
          r.dataset.theme = d ? "dark" : "light";
          r.dataset.accent = a;
          r.style.colorScheme = d ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = d ? "#1b1b1d" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Your private cinema for manhwa. Watch, pick up where you left off, and discover your next chapter." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
